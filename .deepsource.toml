version = 1

test_patterns = [
  "tests/**",
  "test/**",
  "**/*test*",
  "**/*.test.*",
]

exclude_patterns = [
  "node_modules/**",
  "dist/**",
  "target/**",
  "vendor/**",
  "build/**",
  "coverage/**",
  "bundle.js",
  "**/bundle.js",
  "**/generated/**",
]

[[analyzers]]
name = "rust"
enabled = true

  [analyzers.meta]
  msrv = "stable"
  cyclomatic_complexity_threshold = "high"
